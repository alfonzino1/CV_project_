# Helm Chart for Industrial QC MLOps Platform
apiVersion: v2
name: industrial-qc
description: Production-ready MLOps platform for industrial quality control with YOLOv8
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - mlops
  - computer-vision
  - defect-detection
  - yolo
  - torchserve
maintainers:
  - name: MLOps Team
    email: mlops@example.com

dependencies:
  - name: prometheus
    version: 15.0.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: 6.0.0
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled
  - name: minio
    version: 5.0.0
    repository: https://charts.min.io
    condition: minio.enabled
