# Model Configuration for YOLOv8

model:
  # Architecture variant: n, s, m, l, x (n=nanospeed, x=maximum accuracy)
  variant: "s"  # YOLOv8s - good balance for production
  
  # Pretrained weights
  pretrained: true
  pretrained_weights: "yolov8s.pt"
  
  # Input configuration
  input:
    channels: 3
    # Will be overridden by data config during training
    height: 640
    width: 640
    
  # Number of classes (must match dataset)
  num_classes: 5
  
  # Class names for inference
  class_names:
    - "crack"
    - "inclusion"
    - "stain"
    - "pitting"
    - "scale"

# Anchor boxes (YOLOv8 uses anchor-free, but kept for compatibility)
anchors:
  # Auto-computed from dataset if null
  auto: true
  
# Model architecture overrides
architecture:
  # Backbone depth multiplier (0.0-1.0)
  depth_multiplier: 0.33
  # Width multiplier (0.0-1.0)
  width_multiplier: 0.5
  # Maximum strides
  max_stride: 64
  
# Loss configuration
loss:
  # Box loss gain
  box_gain: 7.5
  # Classification loss gain
  cls_gain: 0.5
  # DFL (Distribution Focal Loss) gain
  dfl_gain: 1.5
  
# NMS (Non-Maximum Suppression) settings for inference
nms:
  iou_threshold: 0.45
  confidence_threshold: 0.25
  max_detections: 300
  
# Quantization settings for deployment
quantization:
  enabled: true
  # Options: fp16, int8
  dtype: "fp16"
  # Calibration dataset size for int8
  calibration_size: 100
  
# Export formats
export:
  formats:
    - "torchscript"
    - "onnx"
    - "mar"  # TorchServe archive
  # Optimize for deployment target
  optimize_for: "gpu"  # gpu, cpu, tensorrt
