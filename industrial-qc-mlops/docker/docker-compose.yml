# Docker Compose for Local Development Stack
# Includes: MinIO, MLflow, Prefect, Prometheus, Grafana

version: "3.8"

services:
  # === MinIO (S3-compatible storage) ===
  minio:
    image: minio/minio:RELEASE.2023-04-20T17-56-05Z
    container_name: industrial-qc-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - industrial-qc-network

  # Create MinIO bucket on startup
  minio-init:
    image: minio/mc:RELEASE.2023-04-20T17-56-05Z
    container_name: industrial-qc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-industrial-qc-data}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      mc mb myminio/$$MINIO_BUCKET --ignore-existing;
      mc policy set download myminio/$$MINIO_BUCKET;
      exit 0;
      "
    networks:
      - industrial-qc-network

  # === MLflow Tracking Server ===
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.3.0
    container_name: industrial-qc-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_TRACKING_URI: http://0.0.0.0:5000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_ARTIFACTS_DESTINATION: s3://${MINIO_BUCKET:-industrial-qc-data}/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root s3://${MINIO_BUCKET:-industrial-qc-data}/mlflow
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - industrial-qc-network

  # === Prefect Orion Server ===
  prefect:
    image: prefecthq/prefect:2.10-python3.10
    container_name: industrial-qc-prefect
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_URL: http://0.0.0.0:4200/api
      PREFECT_ORION_DATABASE_CONNECTION_URL: sqlite+aiosqlite:///prefect.db
    command: prefect orion start --host 0.0.0.0 --port 4200
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - industrial-qc-network

  # === Prefect Agent ===
  prefect-agent:
    image: prefecthq/prefect:2.10-python3.10
    container_name: industrial-qc-prefect-agent
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_AGENT_NAME: industrial-qc-agent
    command: prefect agent start
    depends_on:
      prefect:
        condition: service_started
    volumes:
      - ../:/app
    working_dir: /app
    networks:
      - industrial-qc-network

  # === Prometheus ===
  prometheus:
    image: prom/prometheus:v2.43.0
    container_name: industrial-qc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - industrial-qc-network

  # === Grafana ===
  grafana:
    image: grafana/grafana:9.5.2
    container_name: industrial-qc-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - industrial-qc-network

networks:
  industrial-qc-network:
    driver: bridge

volumes:
  minio_data:
  mlflow_data:
  prefect_data:
  prometheus_data:
  grafana_data:
